services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/diva-baihaqi/sipabis-demo:latest
    container_name: sipabis-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: SIPABIS
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_TIMEZONE: Asia/Jakarta
      APP_LOCALE: id
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-sipabis}
      DB_USERNAME: ${DB_USERNAME:-sipabis}
      DB_PASSWORD: ${DB_PASSWORD:-sipabis_secret}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sipabis_storage:/var/www/html/storage/app

  db:
    image: mysql:8.0
    container_name: sipabis-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sipabis}
      MYSQL_USER: ${DB_USERNAME:-sipabis}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sipabis_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - sipabis_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sipabis_mysql:
  sipabis_storage:
